name: checks

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice rules
        run: python3 scripts/check_voice.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Broken links
        run: npx --yes mint broken-links
